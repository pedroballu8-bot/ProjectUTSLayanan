<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengumpulan Tugas - Pembelajaran Virtual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Pembelajaran Virtual</a>
    <nav id="nav"></nav>
  </header>

  <main id="app" class="container"></main>

  <footer class="footer">Layanan Pembelajaran Virtual &middot; Versi demo (data tersimpan di browser)</footer>

  <script src="common.js"></script>
  <script>
    const app = $('#app');

    function view() {
      const dosen = user.role === 'dosen';
      const filter = param('c') || '';
      const list = db.tugas.filter((t) => !filter || t.courseId === filter);

      app.innerHTML = `
        <p class="eyebrow">Pengumpulan Tugas</p>
        <h1>Tugas</h1>
        <div class="card">
          <label for="flt" style="margin-top:0">Filter mata kuliah</label>
          <select id="flt"><option value="">Semua mata kuliah</option>${courseOptions(filter)}</select>
        </div>
        <div id="items"></div>
        ${dosen ? `<div class="card"><h3>Buat Tugas Baru</h3>
          <label>Mata kuliah</label><select id="tc">${courseOptions(filter)}</select>
          <label>Judul</label><input id="tj">
          <label>Deskripsi</label><textarea id="td"></textarea>
          <label>Tenggat</label><input id="tdl" type="datetime-local">
          <p><button id="addt">Simpan</button></p></div>` : ''}`;

      $('#flt').onchange = (e) => { location.search = e.target.value ? `?c=${e.target.value}` : ''; };

      $('#items').innerHTML = list.map((t) => {
        const subs = db.submissions.filter((s) => s.tugasId === t.id);
        const mine = subs.find((s) => s.user === user.nama);
        const late = new Date() > new Date(t.deadline);
        return `<div class="card">
          <span class="badge">${esc(courseName(t.courseId))}</span>
          <h3 style="margin-top:8px">${esc(t.judul)}</h3><p>${esc(t.deskripsi)}</p>
          <p class="muted">Tenggat: ${fmt(t.deadline)} ${late ? '<span class="badge bad">Lewat tenggat</span>' : ''}</p>
          ${dosen
            ? `<h4>Pengumpulan (${subs.length})</h4><ul class="list">${subs.map((s) => `
                <li><strong>${esc(s.user)}</strong> <span class="muted">${fmt(s.waktu)}</span>
                  <p>${esc(s.teks)} ${s.fileName ? `<br><span class="badge">Berkas: ${esc(s.fileName)}</span>` : ''}</p>
                  <div class="row"><input type="number" min="0" max="100" placeholder="Nilai" value="${s.nilai ?? ''}" data-nilai="${s.id}" style="width:110px"><button data-simpan="${s.id}" class="sec">Simpan nilai</button></div>
                </li>`).join('') || '<li class="muted">Belum ada yang mengumpulkan.</li>'}</ul>`
            : mine
              ? `<p><span class="badge ok">Sudah dikumpulkan</span> ${fmt(mine.waktu)}</p><p>${esc(mine.teks)}</p>
                 <p>Nilai: <strong>${mine.nilai ?? 'belum dinilai'}</strong></p>`
              : `<label>Jawaban / tautan</label><textarea data-teks="${t.id}"></textarea>
                 <label>Lampiran (opsional, versi demo hanya mencatat nama berkas)</label><input type="file" data-file="${t.id}">
                 <p><button data-kirim="${t.id}" ${late ? 'disabled' : ''}>Kumpulkan</button></p>`}
        </div>`;
      }).join('') || '<div class="card muted">Belum ada tugas.</div>';

      if (dosen) {
        $('#addt').onclick = () => {
          const judul = $('#tj').value.trim(), dl = $('#tdl').value;
          if (!judul || !dl) return alert('Judul dan tenggat wajib diisi');
          db.tugas.push({ id: uid(), courseId: $('#tc').value, judul, deskripsi: $('#td').value.trim(), deadline: dl });
          save(); view();
        };
        app.querySelectorAll('[data-simpan]').forEach((b) => (b.onclick = () => {
          const s = db.submissions.find((x) => x.id === b.dataset.simpan);
          const v = app.querySelector(`[data-nilai="${s.id}"]`).value;
          s.nilai = v === '' ? null : Math.min(100, Math.max(0, Number(v)));
          save(); alert('Nilai tersimpan');
        }));
      } else {
        app.querySelectorAll('[data-kirim]').forEach((b) => (b.onclick = () => {
          const tid = b.dataset.kirim;
          const teks = app.querySelector(`[data-teks="${tid}"]`).value.trim();
          const f = app.querySelector(`[data-file="${tid}"]`).files[0];
          if (!teks && !f) return alert('Isi jawaban atau pilih berkas');
          db.submissions.push({ id: uid(), tugasId: tid, user: user.nama, teks, fileName: f ? f.name : '', waktu: Date.now(), nilai: null });
          save(); view();
        }));
      }
    }

    if (requireLogin()) { renderNav('tugas.html'); view(); }
  </script>
</body>
</html>
